appId: studio.yourtechbud.isagi
productName: Isagi
asar: true

publish:
  provider: github
  owner: YourTechBudStudio
  repo: Isagi

toolsets:
  appimage: '1.0.3'

directories:
  buildResources: assets
  output: release

icon: app-icon.png

files:
  - from: dist-electron
    to: dist-electron
    filter:
      - '**/*'
  - from: static
    to: static
    filter:
      - '**/*'
  - package.json

extraResources:
  - from: ../web/dist
    to: web
  - from: .generated/runtime
    to: runtime
  # electron-builder intentionally excludes a matcher root named node_modules;
  # copy the stage's isolated closure through its own matcher so .pnpm targets,
  # native bindings, and executable helpers remain physically self-contained.
  - from: .generated/runtime/node_modules
    to: runtime/node_modules

linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: Isagi-linux-x86_64.${ext}
  category: Development
  executableName: isagi
  icon: app-icon-linux.png
  syncDesktopName: true
  desktop:
    entry:
      Name: Isagi
      Categories: Development;
      Terminal: 'false'
      StartupWMClass: studio.yourtechbud.isagi

appImage:
  compression: zstd

mac:
  category: public.app-category.developer-tools
  icon: app-icon.png
  identity: null
  target:
    - dmg
    - zip
