appId: studio.yourtechbud.isagi
productName: Isagi
asar: true

publish:
  provider: github
  owner: YourTechBudStudio
  repo: Isagi

toolsets:
  appimage: '1.0.3'

directories:
  buildResources: assets
  output: release

icon: app-icon.png

files:
  - from: dist-electron
    to: dist-electron
    filter:
      - '**/*'
  - from: static
    to: static
    filter:
      - '**/*'
  - package.json

extraResources:
  - from: ../web/dist
    to: web
  - from: .generated/runtime
    to: runtime
  # electron-builder intentionally excludes a matcher root named node_modules;
  # copy the stage's isolated closure through its own matcher so .pnpm targets,
  # native bindings, and executable helpers remain physically self-contained.
  - from: .generated/runtime/node_modules
    to: runtime/node_modules
  - from: ../../LICENSE
    to: licenses/Isagi-LICENSE.txt
  - from: ../../NOTICE
    to: licenses/Isagi-NOTICE.txt
  - from: assets/LOGO-LICENSE.md
    to: licenses/Isagi-Logo-CC-BY-4.0.md
  - from: ../web/node_modules/@fontsource-variable/fira-code/LICENSE
    to: licenses/Fira-Code-LICENSE.txt
  - from: ../web/node_modules/@fontsource-variable/sora/LICENSE
    to: licenses/Sora-LICENSE.txt
  - from: ../web/node_modules/@fontsource-variable/source-sans-3/LICENSE
    to: licenses/Source-Sans-3-LICENSE.txt
  - from: ../web/src/assets/fonts/LICENSE.txt
    to: licenses/Symbols-Nerd-Font-LICENSE.txt
  - from: node_modules/electron/LICENSE
    to: licenses/Electron-LICENSE.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/Electron-Chromium-LICENSES.html

linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: Isagi-linux-x86_64.${ext}
  category: Development
  executableName: isagi
  # The packaging wrapper stages the canonical PNG here as icon.png so
  # electron-builder generates the complete Linux hicolor icon set.
  icon: .generated/linux-icons
  syncDesktopName: true
  desktop:
    entry:
      Name: Isagi
      Categories: Development;
      Terminal: 'false'
      StartupWMClass: studio.yourtechbud.isagi

appImage:
  compression: zstd

mac:
  category: public.app-category.developer-tools
  # Use the Apple-generated asset directly. electron-builder's PNG-to-ICNS
  # converter corrupts the non-Retina 16x16 frame used by compact Finder views.
  icon: app-icon.icns
