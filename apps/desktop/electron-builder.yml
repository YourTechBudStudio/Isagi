appId: studio.yourtechbud.isagi
productName: Isagi
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*

directories:
  buildResources: assets
  output: release

icon: app-icon.png

files:
  - from: dist-electron
    to: dist-electron
    filter:
      - '**/*'
  - from: static
    to: static
    filter:
      - '**/*'
  - from: ../runtime/dist
    to: runtime
  - from: ../runtime/drizzle
    to: runtime/drizzle
  - package.json

extraResources:
  - from: ../web/dist
    to: web

mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
    - zip
