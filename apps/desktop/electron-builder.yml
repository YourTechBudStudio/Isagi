appId: studio.yourtechbud.isagi
productName: Isagi
asar: true

directories:
  buildResources: assets
  output: release

icon: app-icon.png

files:
  - from: dist-electron
    to: dist-electron
    filter:
      - '**/*'
  - from: static
    to: static
    filter:
      - '**/*'
  - package.json

extraResources:
  - from: ../web/dist
    to: web
  - from: .generated/runtime
    to: runtime
  # electron-builder intentionally excludes a matcher root named node_modules;
  # copy the stage's isolated closure through its own matcher so .pnpm targets,
  # native bindings, and executable helpers remain physically self-contained.
  - from: .generated/runtime/node_modules
    to: runtime/node_modules

linux:
  artifactName: Isagi-${version}-${arch}.${ext}
  category: Development
  executableName: isagi
  icon: app-icon-linux.png
  syncDesktopName: true

mac:
  category: public.app-category.developer-tools
  icon: app-icon.png
  identity: null
  target:
    - dmg
    - zip
