name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the released commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install native verifier tools
        run: sudo apt-get update && sudo apt-get install --yes desktop-file-utils squashfs-tools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify Linux x64
        run: pnpm package:desktop:linux
      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/Isagi-linux-x86_64.AppImage
            apps/desktop/release/install-isagi-linux.sh
            apps/desktop/release/latest-linux.yml

  mac_arm64:
    name: macOS arm64
    environment: Production
    runs-on: macos-15
    steps:
      - name: Check out the released commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify macOS arm64
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
        run: pnpm package:desktop:mac -- --arm64
      - name: Upload macOS arm64 release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.dmg
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.dmg.blockmap
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.zip
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.zip.blockmap
            apps/desktop/release/mac-arm64/latest-mac.yml

  mac_x64:
    name: macOS x64
    environment: Production
    runs-on: macos-15-intel
    steps:
      - name: Check out the released commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify macOS x64
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
        run: pnpm package:desktop:mac -- --x64
      - name: Upload macOS x64 release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/mac-x64/Isagi-mac-x64.dmg
            apps/desktop/release/mac-x64/Isagi-mac-x64.dmg.blockmap
            apps/desktop/release/mac-x64/Isagi-mac-x64.zip
            apps/desktop/release/mac-x64/Isagi-mac-x64.zip.blockmap
            apps/desktop/release/mac-x64/latest-mac.yml

  attach_assets:
    name: Attach release assets
    needs: [linux, mac_arm64, mac_x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the released commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Download Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x64
          path: release-input/linux
      - name: Download macOS arm64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-arm64
          path: release-input/mac-arm64
      - name: Download macOS x64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-x64
          path: release-input/mac-x64
      - name: Assemble release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node scripts/release-pipeline/aggregate-release.mjs
          --linux release-input/linux
          --mac-x64 release-input/mac-x64
          --mac-arm64 release-input/mac-arm64
          --output release-assets
          --version "${RELEASE_TAG#v}"
      - name: Attach assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  npm:
    name: Publish npm package
    needs: [linux, mac_arm64, mac_x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the released commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later (https://docs.npmjs.com/trusted-publishers/).
      - name: Install an npm CLI with trusted publishing
        run: npm install --global npm@11.5.1
      - name: Skip a version already on npm
        id: published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "tarball=.generated/npm-package/yourtechbudstudio-isagi-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
          if npm view "@yourtechbudstudio/isagi@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@yourtechbudstudio/isagi@${VERSION} is already on npm; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable Corepack
        if: steps.published.outputs.skip != 'true'
        run: corepack enable
      - name: Install dependencies
        if: steps.published.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build and pack
        if: steps.published.outputs.skip != 'true'
        run: pnpm package:npm
      - name: Install and exercise the packed tarball in a clean directory
        if: steps.published.outputs.skip != 'true'
        run: pnpm verify:npm "${{ steps.published.outputs.tarball }}"
      - name: Publish the exercised tarball
        if: steps.published.outputs.skip != 'true'
        run: npm publish "${{ steps.published.outputs.tarball }}" --access public
