name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    name: Classify release
    runs-on: ubuntu-24.04
    outputs:
      commitSha: ${{ steps.release.outputs.commitSha }}
      kind: ${{ steps.release.outputs.kind }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Classify and validate release intent
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-pipeline/preflight.mjs

  quality:
    name: Verify repository
    needs: classify
    if: needs.classify.outputs.kind == 'stable_release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the repository quality gate
        run: pnpm check

  linux:
    name: Linux x64
    needs: [classify, quality]
    if: needs.classify.outputs.kind == 'stable_release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install native verifier tools
        run: sudo apt-get update && sudo apt-get install --yes desktop-file-utils squashfs-tools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify Linux x64
        run: pnpm package:desktop:linux
      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/Isagi-linux-x86_64.AppImage
            apps/desktop/release/install-isagi-linux.sh
            apps/desktop/release/latest-linux.yml

  mac_arm64:
    name: macOS arm64
    needs: [classify, quality]
    if: needs.classify.outputs.kind == 'stable_release'
    runs-on: macos-15
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify macOS arm64
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
        run: pnpm package:desktop:mac -- --arm64
      - name: Upload macOS arm64 release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.dmg
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.dmg.blockmap
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.zip
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.zip.blockmap
            apps/desktop/release/mac-arm64/latest-mac.yml

  mac_x64:
    name: macOS x64
    needs: [classify, quality]
    if: needs.classify.outputs.kind == 'stable_release'
    runs-on: macos-15-intel
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify macOS x64
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
        run: pnpm package:desktop:mac -- --x64
      - name: Upload macOS x64 release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/mac-x64/Isagi-mac-x64.dmg
            apps/desktop/release/mac-x64/Isagi-mac-x64.dmg.blockmap
            apps/desktop/release/mac-x64/Isagi-mac-x64.zip
            apps/desktop/release/mac-x64/Isagi-mac-x64.zip.blockmap
            apps/desktop/release/mac-x64/latest-mac.yml

  aggregate:
    name: Aggregate release
    needs: [classify, linux, mac_arm64, mac_x64]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x64
          path: release-input/linux
      - name: Download macOS arm64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-arm64
          path: release-input/mac-arm64
      - name: Download macOS x64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-x64
          path: release-input/mac-x64
      - name: Validate and aggregate release assets
        run: >-
          node scripts/release-pipeline/aggregate-release.mjs
          --linux release-input/linux
          --mac-x64 release-input/mac-x64
          --mac-arm64 release-input/mac-arm64
          --output release-aggregate
          --version '${{ needs.classify.outputs.version }}'
          --tag '${{ needs.classify.outputs.tag }}'
          --commit '${{ needs.classify.outputs.commitSha }}'
      - name: Upload the closed release aggregate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-aggregate-${{ needs.classify.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: release-aggregate

  publish:
    name: Publish release
    needs: [classify, aggregate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the release aggregate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-aggregate-${{ needs.classify.outputs.version }}
          path: release-aggregate
      - name: Revalidate aggregate and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.classify.outputs.commitSha }}
          RELEASE_TAG: ${{ needs.classify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.classify.outputs.version }}
        run: node scripts/release-pipeline/publish-release.mjs release-aggregate
