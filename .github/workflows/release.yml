name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    name: Classify release
    runs-on: ubuntu-24.04
    outputs:
      commitSha: ${{ steps.release.outputs.commitSha }}
      kind: ${{ steps.release.outputs.kind }}
      releaseState: ${{ steps.release.outputs.releaseState }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Classify and validate release intent
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-pipeline/preflight.mjs

  # quality:
  #   name: Verify repository
  #   needs: classify
  #   if: needs.classify.outputs.kind == 'stable_release'
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - name: Check out the classified commit
  #       uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
  #       with:
  #         ref: ${{ needs.classify.outputs.commitSha }}
  #     - name: Set up Node.js
  #       uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
  #       with:
  #         node-version: 24
  #     - name: Enable Corepack
  #       run: corepack enable
  #     - name: Install dependencies
  #       run: pnpm install --frozen-lockfile
  #     - name: Run the repository quality gate
  #       run: pnpm check

  linux:
    name: Linux x64
    needs: [classify]
    if: needs.classify.outputs.kind == 'stable_release' && needs.classify.outputs.releaseState == 'staged'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install native verifier tools
        run: sudo apt-get update && sudo apt-get install --yes desktop-file-utils squashfs-tools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify Linux x64
        run: pnpm package:desktop:linux
      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/Isagi-linux-x86_64.AppImage
            apps/desktop/release/install-isagi-linux.sh
            apps/desktop/release/latest-linux.yml

  mac_arm64:
    name: macOS arm64
    needs: [classify]
    if: needs.classify.outputs.kind == 'stable_release' && needs.classify.outputs.releaseState == 'staged'
    environment: Production
    runs-on: macos-15
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify macOS arm64
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
        run: pnpm package:desktop:mac -- --arm64
      - name: Upload macOS arm64 release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.dmg
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.dmg.blockmap
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.zip
            apps/desktop/release/mac-arm64/Isagi-mac-arm64.zip.blockmap
            apps/desktop/release/mac-arm64/latest-mac.yml

  mac_x64:
    name: macOS x64
    needs: [classify]
    if: needs.classify.outputs.kind == 'stable_release' && needs.classify.outputs.releaseState == 'staged'
    environment: Production
    runs-on: macos-15-intel
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify macOS x64
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
        run: pnpm package:desktop:mac -- --x64
      - name: Upload macOS x64 release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/mac-x64/Isagi-mac-x64.dmg
            apps/desktop/release/mac-x64/Isagi-mac-x64.dmg.blockmap
            apps/desktop/release/mac-x64/Isagi-mac-x64.zip
            apps/desktop/release/mac-x64/Isagi-mac-x64.zip.blockmap
            apps/desktop/release/mac-x64/latest-mac.yml

  finalize:
    name: Attach assets and promote release
    needs: [classify, linux, mac_arm64, mac_x64]
    if: needs.classify.outputs.releaseState == 'staged'
    environment: Production
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x64
          path: release-input/linux
      - name: Download macOS arm64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-arm64
          path: release-input/mac-arm64
      - name: Download macOS x64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-x64
          path: release-input/mac-x64
      - name: Validate and aggregate release assets
        run: >-
          node scripts/release-pipeline/aggregate-release.mjs
          --linux release-input/linux
          --mac-x64 release-input/mac-x64
          --mac-arm64 release-input/mac-arm64
          --output release-aggregate
          --version '${{ needs.classify.outputs.version }}'
          --tag '${{ needs.classify.outputs.tag }}'
          --commit '${{ needs.classify.outputs.commitSha }}'
      # Promoting the staged prerelease to stable is the last thing that happens, so a failure
      # anywhere above leaves a prerelease nobody is being offered rather than an announced
      # stable version without downloads. Promotion uses github.token, which cannot retrigger
      # this workflow, and the prerelease-to-stable transition emits `released`, not `published`.
      - name: Attach assets and promote the staged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.classify.outputs.commitSha }}
          RELEASE_TAG: ${{ needs.classify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.classify.outputs.version }}
        run: node scripts/release-pipeline/finalize-release.mjs release-aggregate

  # The recovery path for a run that promoted the release but failed before it could confirm it.
  # Reaching it requires "Re-run all jobs": classify must run again to observe the promoted state,
  # and "Re-run failed jobs" would reuse the previous run's classification and skip this job.
  # It rebuilds nothing and holds only the workflow's default read permission, because signed
  # macOS artifacts and generated update metadata are not byte-reproducible: a rebuild would
  # disagree with what is already published, and replacing a public asset deletes the working one.
  # The release is proven against the manifest the original run attached instead.
  reconcile:
    name: Verify an already-promoted release
    needs: [classify]
    if: needs.classify.outputs.releaseState == 'promoted'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the classified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify.outputs.commitSha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the promoted release against its attached manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.classify.outputs.commitSha }}
          RELEASE_TAG: ${{ needs.classify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.classify.outputs.version }}
        run: node scripts/release-pipeline/reconcile-release.mjs
